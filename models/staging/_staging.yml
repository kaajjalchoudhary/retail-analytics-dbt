version: 2

models:
  - name: stg_customers
    description: One row per customer with normalised names, emails and country codes.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: email
        data_tests: [unique, not_null]
      - name: country_code
        data_tests:
          - accepted_values:
              values: ["US", "GB", "DE", "IN", "AE", "CA", "FR", "AU"]

  - name: stg_products
    description: Product catalogue with unit margin.
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: unit_price
        data_tests: [is_positive]

  - name: stg_orders
    description: Latest version of each order (deduplicated across loads).
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: status
        data_tests:
          - accepted_values:
              values: ["placed", "shipped", "completed", "returned", "cancelled"]

  - name: stg_order_items
    description: Order lines.
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: product_id
        data_tests:
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: quantity
        data_tests: [is_positive]

  - name: stg_payments
    description: Payment attempts converted from cents to dollars.
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: amount
        data_tests: [is_positive]
      - name: payment_method
        data_tests:
          - accepted_values:
              values: ["credit_card", "debit_card", "paypal", "bank_transfer", "gift_card"]
      - name: payment_status
        data_tests:
          - accepted_values:
              values: ["success", "failed"]
